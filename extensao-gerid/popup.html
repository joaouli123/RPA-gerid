<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerid RPA</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      margin: 0;
      color: #333;
    }
    h2 { margin-top: 0; font-size: 16px; color: #2563eb; }
    .status-box {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .status-text { font-size: 14px; margin-bottom: 4px; }
    .status-count { font-size: 24px; font-weight: bold; color: #1f2937; }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    
    .config { margin-top: 16px; border-top: 1px solid #e5e7eb; padding-top: 12px; }
    .config label { display: block; font-size: 12px; margin-bottom: 4px; color: #6b7280; }
    .config input { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; }
    
    #log {
      margin-top: 16px;
      font-size: 11px;
      color: #6b7280;
      max-height: 100px;
      overflow-y: auto;
      background: #f9fafb;
      padding: 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h2>Gerid RPA Automator</h2>
  
  <div class="status-box">
    <div class="status-text" id="statusLabel">Verificando fila...</div>
    <div class="status-count" id="countLabel">-</div>
  </div>

  <button id="btnStart" disabled>Iniciar Protocolos</button>

  <div id="log">Aguardando...</div>

  <div class="config">
    <label for="apiUrl">URL do Sistema (Coolify ou Localhost):</label>
    <input type="text" id="apiUrl" value="https://vmkcogtpgc1dgd5ae6gjfz1n.179.198.98.63.sslip.io">
  </div>

  <script src="popup.js"></script>
</body>
</html>
